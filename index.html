<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hayder Hasan</title>
<style>
  :root{--ground:#171717; --ink:#8f8f8f}
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--ground)}
  body{
    color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    padding:64px 48px 56px; min-height:100vh; display:flex; flex-direction:column; gap:96px;
  }
  .row{display:flex; flex-wrap:wrap; gap:56px; align-items:flex-start}
  .row img{display:block; width:390px; max-width:100%; height:auto; border-radius:46px}
  .row.components img{width:auto; max-width:100%; border-radius:0}
  p{margin:auto 0 0; font-size:13px; letter-spacing:.01em}
  @media (max-width:520px){
    body{padding:40px 24px 40px; gap:64px}
    .row{gap:40px}
    .row img{border-radius:36px}
  }
</style>
</head>
<body>

  <div class="row">
    <img src="img/screen-1-direction.png" srcset="img/screen-1-direction.png 2x" alt="">
    <img src="img/screen-2-listing.png" srcset="img/screen-2-listing.png 2x" alt="">
    <img src="img/screen-3-purple-a.png" srcset="img/screen-3-purple-a.png 2x" alt="">
    <img src="img/screen-4-purple-b.png" srcset="img/screen-4-purple-b.png 2x" alt="">
  </div>

  <div class="row components">
    <img src="img/components-1-direction.png" srcset="img/components-1-direction.png 2x" alt="">
    <img src="img/components-2-listing.png" srcset="img/components-2-listing.png 2x" alt="">
    <img src="img/components-3-purple.png" srcset="img/components-3-purple.png 2x" alt="">
  </div>

  <p>Everything on this site is the intellectual property of Hayder Hasan.</p>

</body>
</html>
